services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    
    container_name: agrimarket-backend
    
    ports:
      - "8000:8000"
    
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///db.sqlite3}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@agrimarket.local}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
    
    depends_on: []
    
    volumes:
      - ./backend:/app
    
    networks:
      - agrimarket-network
    restart: unless-stopped
    
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    
    container_name: agrimarket-frontend    
    ports:
      - "3000:8080"
    
    depends_on:
      - backend
    
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    
    volumes: []
    
    networks:
      - agrimarket-network
    restart: unless-stopped
    
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  agrimarket-network:
    driver: bridge
    name: agrimarket-network
volumes:
  db_data:
    driver: local
