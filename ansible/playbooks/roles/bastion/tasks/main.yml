---
- name: Bastion | Update system packages
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Bastion | Install Docker and dependencies
  apt:
    name:
      - docker.io
      - docker-compose
      - curl
      - awscli
    state: present

- name: Bastion | Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Bastion | Verify Docker is installed and running
  service:
    name: docker
    state: started
    enabled: yes

- name: Bastion | Verify Docker Compose is installed
  shell: "docker compose --version"
  register: docker_compose_version
  changed_when: false
  failed_when: docker_compose_version.rc != 0

- name: Bastion | Display Docker info
  debug:
    msg:
      - "Bastion host is ready for deployment"
      - "Docker version: {{ docker_compose_version.stdout }}"

- name: Bastion | Configure SSH for app server forwarding
  blockinfile:
    path: /etc/ssh/sshd_config
    block: |
      AllowAgentForwarding yes
      GatewayPorts clientspecified
    marker: "# {mark} ANSIBLE MANAGED BLOCK - APP SERVER FORWARDING"
  notify: restart ssh

- name: Bastion | Install nginx for reverse proxy
  apt:
    name: nginx
    state: present

- name: Bastion | Create nginx temp directories
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: 0755
  loop:
    - /tmp/nginx_proxy
    - /tmp/nginx_client

- name: Bastion | Disable default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Bastion | Configure nginx as reverse proxy
  template:
    src: nginx-reverse-proxy.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
  vars:
    app_server_private_ip: "10.0.172.212"

- name: Bastion | Start and enable nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Bastion | Ensure ubuntu user can use docker
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Bastion | Create application deployment directory
  file:
    path: /opt/agrimarket
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: 0755

- name: Bastion | Display Bastion readiness status
  debug:
    msg: |
      🚀 Bastion host ({{ inventory_hostname }}) is ready for {{ deploy_environment }}!
      Reverse proxy enabled on ports 3000 (frontend) and 8000 (backend)
      Access from bastion only:
        - Frontend: http://10.0.172.212:3000 (from bastion)
        - Backend API: http://10.0.172.212:8000 (from bastion)
