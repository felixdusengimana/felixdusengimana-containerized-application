---
- name: App Server | Update system packages
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: App Server | Install Docker and dependencies
  apt:
    name:
      - docker.io
      - docker-compose
      - curl
      - awscli
    state: present

- name: App Server | Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: App Server | Verify Docker is installed and running
  service:
    name: docker
    state: started
    enabled: yes

- name: App Server | Ensure ubuntu user can use docker
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: App Server | Create application deployment directory
  file:
    path: /opt/agrimarket
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: 0755

- name: App Server | Get AWS Account ID if ecr_registry is empty
  shell: "aws sts get-caller-identity --query Account --output text"
  register: aws_account_id
  changed_when: false
  when: ecr_registry is not defined or ecr_registry == "" or ecr_registry is none

- name: App Server | Set ecr_registry from AWS Account ID
  set_fact:
    ecr_registry: "{{ aws_account_id.stdout }}.dkr.ecr.us-east-1.amazonaws.com"
  when: ecr_registry is not defined or ecr_registry == "" or ecr_registry is none

- name: App Server | Login to ECR
  shell: |
    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin {{ ecr_registry }}
  environment:
    AWS_DEFAULT_REGION: us-east-1
  register: ecr_login
  changed_when: "'Login Succeeded' in ecr_login.stdout"
  when: ecr_registry != ""

- name: App Server | Create docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/agrimarket/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: 0644
  vars:
    backend_image_url: "{{ ecr_registry }}/agrimarket-backend"
    frontend_image_url: "{{ ecr_registry }}/agrimarket-frontend"

- name: App Server | Create .env file for Django
  template:
    src: .env.j2
    dest: /opt/agrimarket/.env
    owner: ubuntu
    group: ubuntu
    mode: 0600
  no_log: true

- name: App Server | Stop existing containers (if any)
  shell: "cd /opt/agrimarket && docker-compose down"
  args:
    chdir: /opt/agrimarket
  ignore_errors: true
  when: backend_image_changed or frontend_image_changed

- name: App Server | Pull and start containers
  shell: "cd /opt/agrimarket && docker-compose up -d"
  args:
    chdir: /opt/agrimarket
  register: docker_compose_up
  changed_when: "'Created' in docker_compose_up.stdout or 'Started' in docker_compose_up.stdout"

- name: App Server | Wait for backend to be ready
  wait_for:
    port: 8000
    delay: 10
    timeout: 60
  when: backend_image_changed

- name: App Server | Wait for frontend to be ready
  wait_for:
    port: 3000
    delay: 10
    timeout: 60
  when: frontend_image_changed

- name: App Server | Check backend health
  uri:
    url: "http://localhost:8000/api/products/"
    method: GET
    status_code: 200
  register: backend_health
  retries: 5
  delay: 5
  when: backend_image_changed

- name: App Server | Check frontend health
  uri:
    url: "http://localhost:3000/"
    method: GET
    status_code: 200
  register: frontend_health
  retries: 5
  delay: 5
  when: frontend_image_changed

- name: App Server | Display deployment status
  debug:
    msg: |
      ✅ Application deployed successfully!
      Environment: {{ deploy_environment }}
      Backend: http://{{ inventory_hostname }}:8000
      Frontend: http://{{ inventory_hostname }}:3000
      PostgreSQL: {{ inventory_hostname }}:5432

- name: App Server | Show running containers
  shell: "docker ps --format 'table {{.Names}}\t{{.Status}}'"
  register: running_containers
  changed_when: false

- name: App Server | Display running containers
  debug:
    msg: "{{ running_containers.stdout_lines }}"
