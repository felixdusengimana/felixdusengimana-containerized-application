---
- name: Deploy AgriMarket Application
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    app_dir: /opt/agrimarket
    app_user: ubuntu
    aws_region: "{{ aws_region | default('us-east-1') }}"
    container_restart_policy: "unless-stopped"

  pre_tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        delay: 5
        timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
      when: ansible_os_family is defined and ansible_os_family == "Debian"

    - name: Display deployment information
      debug:
        msg: |
          Deployment Starting:
          - Backend Image: {{ backend_image | default('not specified') }}
          - Frontend Image: {{ frontend_image | default('not specified') }}
          - App Directory: {{ app_dir }}
          - AWS Region: {{ aws_region }}

  tasks:
    - name: Ensure Docker is installed and running
      block:
        - name: Check Docker installation
          command: docker --version
          register: docker_check
          failed_when: false
          changed_when: false

        - name: Display Docker version
          debug:
            msg: "Docker is installed: {{ docker_check.stdout }}"
          when: docker_check.rc == 0

        - name: Start Docker service
          systemd:
            name: docker
            state: started
            enabled: yes
          when: ansible_os_family is defined and ansible_os_family == "Debian"

    - name: Ensure Docker Compose is available
      block:
        - name: Check Docker Compose installation
          command: docker-compose --version
          register: compose_check
          failed_when: false
          changed_when: false

        - name: Display Docker Compose version
          debug:
            msg: "Docker Compose is available: {{ compose_check.stdout }}"
          when: compose_check.rc == 0

    - name: Authenticate to ECR
      block:
        - name: Login to ECR with provided credentials
          shell: |
            echo "{{ docker_registry_password }}" | docker login -u "{{ docker_registry_username }}" --password-stdin $(echo "{{ backend_image }}" | cut -d'/' -f1)
          register: ecr_login
          changed_when: false
          no_log: true
          when: docker_registry_password is defined and docker_registry_username is defined

        - name: Verify Docker authentication
          command: docker ps
          register: docker_status
          changed_when: false
          retries: 3
          delay: 5
          until: docker_status.rc == 0

    - name: Setup application directory
      block:
        - name: Create application directory
          file:
            path: "{{ app_dir }}"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: '0755'

        - name: Create .env file for Docker Compose
          copy:
            content: |
              # Generated by Ansible deployment pipeline
              DEBUG=False
              SECRET_KEY={{ secret_key | default('change-me-in-production') }}
              ALLOWED_HOSTS=*
              DATABASE_URL={{ database_url | default('sqlite:///db.sqlite3') }}
              DJANGO_SUPERUSER_USERNAME=admin
              DJANGO_SUPERUSER_PASSWORD={{ django_superuser_password | default('admin') }}
              DJANGO_SUPERUSER_EMAIL={{ django_superuser_email | default('admin@agrimarket.local') }}
              CORS_ALLOWED_ORIGINS=*
            dest: "{{ app_dir }}/.env"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: '0600'
          no_log: true

        - name: Copy docker-compose.yml from repository
          copy:
            src: docker-compose.yml
            dest: "{{ app_dir }}/docker-compose.yml"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: '0644'
          when: false  # We'll use the existing one from the repo

        - name: Create docker-compose.yml for production deployment
          copy:
            content: |
              version: '3.8'
              
              services:
                backend:
                  image: "{{ backend_image }}"
                  container_name: agrimarket-backend
                  ports:
                    - "8000:8000"
                  environment:
                    - DEBUG=False
                    - SECRET_KEY={{ secret_key | default('change-me-in-production') }}
                    - ALLOWED_HOSTS=*
                    - DATABASE_URL={{ database_url | default('sqlite:///db.sqlite3') }}
                    - DJANGO_SUPERUSER_USERNAME=admin
                    - DJANGO_SUPERUSER_PASSWORD={{ django_superuser_password | default('admin') }}
                    - DJANGO_SUPERUSER_EMAIL={{ django_superuser_email | default('admin@agrimarket.local') }}
                    - CORS_ALLOWED_ORIGINS=*
                  healthcheck:
                    test: ["CMD", "curl", "-f", "http://localhost:8000/api/products/ || exit 1"]
                    interval: 30s
                    timeout: 10s
                    retries: 3
                    start_period: 40s
                  restart: {{ container_restart_policy }}
                  logging:
                    driver: "json-file"
                    options:
                      max-size: "10m"
                      max-file: "3"

                frontend:
                  image: "{{ frontend_image }}"
                  container_name: agrimarket-frontend
                  ports:
                    - "80:80"
                  depends_on:
                    - backend
                  healthcheck:
                    test: ["CMD", "curl", "-f", "http://localhost:80/ || exit 1"]
                    interval: 30s
                    timeout: 10s
                    retries: 3
                    start_period: 40s
                  restart: {{ container_restart_policy }}
                  logging:
                    driver: "json-file"
                    options:
                      max-size: "10m"
                      max-file: "3"
            dest: "{{ app_dir }}/docker-compose.yml"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: '0644'

    - name: Build and deploy with Docker Compose
      block:
        - name: Stop running containers (if any)
          shell: |
            cd {{ app_dir }} && docker-compose down --remove-orphans 2>/dev/null || true
          changed_when: false

        - name: Wait before pulling new images
          pause:
            seconds: 5

        - name: Pull latest images
          shell: |
            cd {{ app_dir }} && docker-compose pull
          environment:
            COMPOSE_DOCKER_CLI_BUILD: "1"
          register: compose_pull
          retries: 3
          delay: 10
          until: compose_pull.rc == 0

        - name: Start services with Docker Compose
          shell: |
            cd {{ app_dir }} && docker-compose up -d
          register: compose_up
          changed_when: "'Creating' in compose_up.stdout or 'Starting' in compose_up.stdout"
          retries: 2
          delay: 5
          until: compose_up.rc == 0

        - name: Give services time to start
          pause:
            seconds: 15

    - name: Application health checks
      block:
        - name: Wait for backend service to be ready
          wait_for:
            host: "127.0.0.1"
            port: 8000
            delay: 5
            timeout: 120
            state: started

        - name: Check backend API health
          uri:
            url: "http://127.0.0.1:8000/api/products/"
            method: GET
            status_code: [200, 301, 302, 401, 403]
            follow_redirects: safe
          register: backend_health
          retries: 5
          delay: 10
          until: backend_health.status | default(0) >= 200 and backend_health.status | default(0) < 500

        - name: Wait for frontend service to be ready
          wait_for:
            host: "127.0.0.1"
            port: 80
            delay: 5
            timeout: 120
            state: started

        - name: Check frontend health
          uri:
            url: "http://127.0.0.1:80/"
            method: GET
            status_code: [200, 301, 302]
            follow_redirects: safe
          register: frontend_health
          retries: 5
          delay: 10
          until: frontend_health.status | default(0) >= 200 and frontend_health.status | default(0) < 400

        - name: Display service status
          shell: |
            cd {{ app_dir }} && docker-compose ps
          register: service_status
          changed_when: false

        - name: Show service status
          debug:
            var: service_status.stdout_lines

        - name: Check running containers
          shell: docker ps --format "table {{.Names}}\t{{.Status}}"
          register: containers
          changed_when: false

        - name: Show running containers
          debug:
            var: containers.stdout_lines

  handlers:
    - name: Restart application
      shell: |
        cd {{ app_dir }} && docker-compose restart
      listen: "restart application"

  post_tasks:
    - name: Deployment Summary
      debug:
        msg: |
          ========================================
          ✓ Deployment Successful!
          ========================================
          
          Services Deployed:
          - Backend API: http://{{ inventory_hostname }}:8000
          - Frontend: http://{{ inventory_hostname }}:80
          
          Docker Compose Status:
          {{ service_status.stdout if service_status is defined else 'N/A' }}
          
          ========================================"
          Application is running at:
            - Backend API: http://{{ ansible_default_ipv4.address }}:8000/
            - Frontend: http://{{ ansible_default_ipv4.address }}:8080/
          
          Services Status:
          {{ service_status.stdout }}
