name: Application Deployment

on:
  workflow_run:
    workflows: ['Infrastructure Pipeline']
    types: [completed]
    branches:
      - main
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - '.github/workflows/deploy.yml'
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ''
  BACKEND_IMAGE_NAME: agrimarket-backend
  FRONTEND_IMAGE_NAME: agrimarket-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images to ECR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      backend_image: ${{ steps.build.outputs.backend_image }}
      frontend_image: ${{ steps.build.outputs.frontend_image }}
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Registry
        id: ecr
        run: |
          REGISTRY=$(aws ecr describe-repositories --repository-names ${{ env.BACKEND_IMAGE_NAME }} 2>/dev/null | jq -r '.repositories[0].registryId' || echo "")
          if [ -z "$REGISTRY" ]; then
            echo "Creating ECR repositories..."
            aws ecr create-repository --repository-name ${{ env.BACKEND_IMAGE_NAME }} --image-scanning-configuration scanOnPush=true 2>/dev/null || true
            aws ecr create-repository --repository-name ${{ env.FRONTEND_IMAGE_NAME }} --image-scanning-configuration scanOnPush=true 2>/dev/null || true
            REGISTRY=$(aws sts get-caller-identity | jq -r '.Account')
          fi
          ECR_URL="${REGISTRY}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ecr_registry=$ECR_URL" >> $GITHUB_OUTPUT
          echo "ECR Registry: $ECR_URL"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Backend Image
        id: build-backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.ecr_registry }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ steps.ecr.outputs.ecr_registry }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.ecr_registry }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.ecr_registry }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Build and Push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.ecr_registry }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ steps.ecr.outputs.ecr_registry }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.ecr_registry }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.ecr_registry }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Output Image URIs
        id: build
        run: |
          BACKEND_IMAGE="${{ steps.ecr.outputs.ecr_registry }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"
          FRONTEND_IMAGE="${{ steps.ecr.outputs.ecr_registry }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"
          echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
          echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
          echo "Backend Image: $BACKEND_IMAGE"
          echo "Frontend Image: $FRONTEND_IMAGE"

  deploy-application:
    name: Deploy Application via Ansible
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Application Server IPs
        id: get-ip
        run: |
          # Get App VM private IP
          APP_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=agrimarket-app-*" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PrivateIpAddress" \
            --output text | head -1)
          
          if [ -z "$APP_IP" ]; then
            echo "::error::Could not retrieve application server IP"
            exit 1
          fi
          
          # Get Bastion public IP for SSH tunneling
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=agrimarket-bastion" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          
          if [ -z "$BASTION_IP" ]; then
            echo "::error::Could not retrieve bastion IP"
            exit 1
          fi
          
          echo "app_ip=$APP_IP" >> $GITHUB_OUTPUT
          echo "bastion_ip=$BASTION_IP" >> $GITHUB_OUTPUT
          echo "Application Server IP (Private): $APP_IP"
          echo "Bastion IP (Public): $BASTION_IP"

      - name: Wait for SSH to be available
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa ubuntu@${{ steps.get-ip.outputs.bastion_ip }}" \
              ubuntu@${{ steps.get-ip.outputs.app_ip }} "echo 'SSH is available'" 2>/dev/null; then
              echo "SSH via bastion is available"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Waiting for SSH via bastion... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            sleep 10
          done
          echo "::error::SSH not available after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Create Private Key File
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add SSH config for bastion jump host
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ steps.get-ip.outputs.bastion_ip }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          
          Host app
            HostName ${{ steps.get-ip.outputs.app_ip }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          
          chmod 600 ~/.ssh/config
          ssh-keyscan -H ${{ steps.get-ip.outputs.bastion_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via Ansible
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: ansible/playbooks/deploy.yml
          directory: ./
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          inventory: |
            [app]
            ${{ steps.get-ip.outputs.app_ip }} ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3
          options: |
            -vv \
            --extra-vars "backend_image=${{ needs.build-and-push.outputs.backend_image }}" \
            --extra-vars "frontend_image=${{ needs.build-and-push.outputs.frontend_image }}" \
            --extra-vars "docker_registry_username=AWS" \
            --extra-vars "docker_registry_password=$(aws ecr get-authorization-token --query 'authorizationData[0].authorizationToken' --output text | base64 -d | cut -d: -f2)" \
            --extra-vars "secret_key=${{ secrets.DJANGO_SECRET_KEY }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_CONFIG: ansible/ansible.cfg

      - name: Health Check - Backend
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f http://${{ steps.get-ip.outputs.app_ip }}:8000/api/products/ 2>/dev/null; then
              echo "✅ Backend API is healthy"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Waiting for backend API... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            sleep 6
          done
          echo "::error::Backend API health check failed"
          exit 1
        continue-on-error: true

      - name: Health Check - Frontend
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f http://${{ steps.get-ip.outputs.app_ip }}:3000/ 2>/dev/null; then
              echo "✅ Frontend is healthy"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Waiting for frontend... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            sleep 6
          done
          echo "::error::Frontend health check failed"
          exit 1
        continue-on-error: true

      - name: Smoke Tests
        run: |
          echo "Running smoke tests..."
          
          # Test backend API endpoints
          echo "Testing backend endpoints..."
          curl -v http://${{ steps.get-ip.outputs.app_ip }}:8000/api/products/ | head -c 200
          
          echo -e "\n✅ Smoke tests completed"
        continue-on-error: true

  send-notifications:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    needs: [deploy-application]
    if: always()

    steps:
      - name: Send Success Notification
        if: needs.deploy-application.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '✅ Application Deployment Successful'
          html_body: |
            <h2>Application Deployment Complete</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Deployment Status:</strong> ✅ SUCCESS</p>
            <p><strong>Deployment Trigger:</strong> ${{ github.event_name }}</p>
            <p><strong>Commit:</strong> <code>${{ github.sha }}</code></p>
            
            <h3>Services Deployed:</h3>
            <ul>
              <li>Backend API (Django)</li>
              <li>Frontend (React + TypeScript)</li>
            </ul>
            
            <h3>Next Steps:</h3>
            <ol>
              <li>Access your application at the configured domain</li>
              <li>Verify all features are working as expected</li>
              <li>Monitor application logs for any issues</li>
            </ol>
            
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                 style="background-color: #2ea44f; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">
                View Deployment Details
              </a>
            </p>
            
            <hr>
            <p><small>This is an automated notification from AgriMarket CI/CD Pipeline</small></p>
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <actions@github.com>
        continue-on-error: true

      - name: Send Failure Notification
        if: needs.deploy-application.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '❌ Application Deployment Failed'
          html_body: |
            <h2>Application Deployment Failed</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Deployment Status:</strong> ❌ FAILED</p>
            <p><strong>Deployment Trigger:</strong> ${{ github.event_name }}</p>
            <p><strong>Commit:</strong> <code>${{ github.sha }}</code></p>
            
            <p>The application deployment encountered an error. Please review the logs immediately.</p>
            
            <h3>Troubleshooting Steps:</h3>
            <ol>
              <li>Check SSH connectivity to the application server</li>
              <li>Verify Docker images are available in ECR</li>
              <li>Review Ansible playbook execution logs</li>
              <li>Check application server resource availability</li>
            </ol>
            
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                 style="background-color: #dc3545; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">
                View Error Details
              </a>
            </p>
            
            <hr>
            <p><small>This is an automated notification from AgriMarket CI/CD Pipeline</small></p>
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <actions@github.com>
        continue-on-error: true
