name: Build & Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'ansible/**'
      - 'docker-compose.yml'
      - 'Dockerfile.*'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_IMAGE_NAME: agrimarket-backend
  FRONTEND_IMAGE_NAME: agrimarket-frontend

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      environment: ${{ steps.determine-env.outputs.environment }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
              echo "backend=false" >> $GITHUB_OUTPUT
              echo "frontend=false" >> $GITHUB_OUTPUT
            else
              echo "backend=true" >> $GITHUB_OUTPUT
              echo "frontend=true" >> $GITHUB_OUTPUT
            fi
          else
            git diff --name-only origin/main..HEAD || git diff --name-only HEAD~1 HEAD || echo "No previous commit"
            
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^backend/|^Dockerfile\.backend|^docker-compose\.yml'; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi
            
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^frontend/|^Dockerfile\.frontend|^docker-compose\.yml'; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENV"

      - name: Generate version tag
        id: version
        run: |
          VERSION="${{ github.sha }}"
          SHORT_SHA="${VERSION:0:7}"
          echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Version: $SHORT_SHA"

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest-${{ needs.detect-changes.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest-${{ needs.detect-changes.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plan-infrastructure:
    name: Plan & Apply Terraform
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy'
    permissions:
      contents: read
      id-token: write
    outputs:
      bastion-ip: ${{ steps.outputs.outputs.bastion-public-ip }}
      app-ip: ${{ steps.outputs.outputs.app-private-ip }}
      ecr-registry: ${{ steps.outputs.outputs.ecr-repository-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Clean up unused Elastic IPs (prevent AddressLimitExceeded)
        run: |
          echo "🧹 Checking for unused Elastic IPs..."
          UNASSOC_EIPS=$(aws ec2 describe-addresses --region ${{ env.AWS_REGION }} --query 'Addresses[?AssociationId==null].AllocationId' --output text)
          
          if [ -z "$UNASSOC_EIPS" ]; then
            echo "✓ No unused EIPs found"
          else
            echo "Found unused EIPs: $UNASSOC_EIPS"
            for eip in $UNASSOC_EIPS; do
              echo "Releasing EIP: $eip"
              aws ec2 release-address --allocation-id $eip --region ${{ env.AWS_REGION }} 2>/dev/null || echo "⚠️ Could not release $eip (may be in use)"
            done
          fi

      - name: Create SSH Keys
        run: |
          mkdir -p terraform/
          echo "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > terraform/bastion_key.pem
          chmod 600 terraform/bastion_key.pem

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=agrimarket/${{ needs.detect-changes.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan with Drift Detection
        id: plan
        run: |
          exit_code=0
          terraform plan -detailed-exitcode \
            -var="environment=${{ needs.detect-changes.outputs.environment }}" \
            -var="bastion_public_key=${{ secrets.BASTION_SSH_PUBLIC_KEY }}" \
            -no-color > tfplan.txt 2>&1 || exit_code=$?
          echo "exitcode=$exit_code" >> $GITHUB_OUTPUT
          
          if [ $exit_code -eq 2 ]; then
            echo "::notice::Infrastructure drift detected! Applying changes..."
          elif [ $exit_code -eq 1 ]; then
            echo "::error::Terraform plan failed"
            cat tfplan.txt
            exit 1
          else
            echo "::notice::✓ No infrastructure changes needed"
          fi
          cat tfplan.txt
        working-directory: terraform

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == 2
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ needs.detect-changes.outputs.environment }}" \
            -var="bastion_public_key=${{ secrets.BASTION_SSH_PUBLIC_KEY }}" \
            -no-color
        working-directory: terraform

      - name: Get Terraform Outputs
        id: outputs
        run: |
          # Get infrastructure IPs from Terraform
          BASTION_IP=$(terraform output -raw bastion_public_ip 2>/dev/null || echo "")
          APP_IP=$(terraform output -raw app_private_ip 2>/dev/null || echo "")
          
          # Validate infrastructure outputs exist
          if [ -z "$BASTION_IP" ]; then
            echo "::warning::Bastion public IP is empty"
            BASTION_IP="unknown"
          fi
          
          if [ -z "$APP_IP" ]; then
            echo "::warning::App private IP is empty"
            APP_IP="unknown"
          fi
          
          # Construct ECR registry from AWS account ID (more reliable than Terraform output)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"
          
          echo "bastion-public-ip=$BASTION_IP" >> $GITHUB_OUTPUT
          echo "app-private-ip=$APP_IP" >> $GITHUB_OUTPUT
          echo "ecr-registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT
          
          echo "=== Terraform Outputs ===" 
          echo "✓ Bastion IP: $BASTION_IP"
          echo "✓ App IP: $APP_IP"
          echo "✓ ECR Registry: $ECR_REGISTRY"
          echo "✓ AWS Account ID: $AWS_ACCOUNT_ID"
        working-directory: terraform

  destroy-infrastructure:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=agrimarket/${{ needs.detect-changes.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
        working-directory: terraform

      - name: Terraform Destroy
        run: |
          echo "🚨 Destroying infrastructure in ${{ needs.detect-changes.outputs.environment }}..."
          terraform destroy -auto-approve \
            -var="environment=${{ needs.detect-changes.outputs.environment }}" \
            -var="bastion_public_key=${{ secrets.BASTION_SSH_PUBLIC_KEY }}" \
            -no-color
        working-directory: terraform

      - name: Confirm Destruction
        run: |
          echo "✓ Infrastructure destruction completed for ${{ needs.detect-changes.outputs.environment }}"
          echo "All resources managed by Terraform have been removed"

  deploy-with-ansible:
    name: Deploy with Ansible
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, build-frontend, plan-infrastructure]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.plan-infrastructure.result == 'success')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Infrastructure Outputs
        run: |
          BASTION_IP="${{ needs.plan-infrastructure.outputs.bastion-ip }}"
          APP_IP="${{ needs.plan-infrastructure.outputs.app-ip }}"
          ECR_REGISTRY="${{ needs.plan-infrastructure.outputs.ecr-registry }}"
          
          echo "=== Terraform Outputs ==="
          echo "Bastion IP: $BASTION_IP"
          echo "App IP: $APP_IP"
          echo "ECR Registry: $ECR_REGISTRY"
          echo "Backend Image Tag: ${{ needs.detect-changes.outputs.version }}"
          echo "Frontend Image Tag: ${{ needs.detect-changes.outputs.version }}"
          echo "======================="
          
          if [ "$BASTION_IP" = "unknown" ]; then
            echo "::error::Bastion public IP is unknown. Cannot proceed with deployment."
            exit 1
          fi
          
          if [ -z "$APP_IP" ] || [ "$APP_IP" = "unknown" ]; then
            echo "::error::App private IP is unknown. Cannot proceed with deployment."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ansible/requirements.txt'

      - name: Install Ansible and dependencies
        run: |
          pip install ansible boto3 botocore
          cd ansible && pip install -r requirements.txt || echo "No requirements file"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key.pem
          chmod 600 ~/.ssh/bastion_key.pem
          
          # Verify key was created and is valid
          if [ ! -f ~/.ssh/bastion_key.pem ]; then
            echo "::error::SSH key file not created"
            exit 1
          fi
          
          if [ ! -s ~/.ssh/bastion_key.pem ]; then
            echo "::error::SSH key file is empty"
            exit 1
          fi
          
          # Verify it's a valid private key format
          if ! head -1 ~/.ssh/bastion_key.pem | grep -q "BEGIN"; then
            echo "::error::SSH key does not appear to be a valid private key"
            echo "First line: $(head -1 ~/.ssh/bastion_key.pem)"
            exit 1
          fi
          
          echo "✓ SSH key created and validated"
          
          # Add key to SSH agent
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion_key.pem
          
          # Test bastion connectivity
          echo "Testing connection to bastion: ${{ needs.plan-infrastructure.outputs.bastion-ip }}"
          ssh-keyscan -H ${{ needs.plan-infrastructure.outputs.bastion-ip }} >> ~/.ssh/known_hosts 2>&1 || {
            echo "::warning::Could not pre-scan bastion host key. Will trust on first connection."
          }

      - name: Create Ansible inventory
        run: |
          mkdir -p ansible/inventory
          
          # Get the full path to the SSH key (use $HOME/.ssh not ./.ssh)
          SSH_KEY_PATH="$HOME/.ssh/bastion_key.pem"
          
          # Verify SSH key exists
          if [ ! -f "$SSH_KEY_PATH" ]; then
            echo "ERROR: SSH key not found at $SSH_KEY_PATH"
            ls -la ~/.ssh/ || echo "~/.ssh directory does not exist"
            exit 1
          fi
          
          cat > ansible/inventory/aws.ini << 'EOFINI'
          [bastion_hosts]
          bastion_instance ansible_host=BASTION_IP_PLACEHOLDER ansible_user=ubuntu ansible_ssh_private_key_file=SSH_KEY_PATH_PLACEHOLDER
          
          [app_servers]
          app_server ansible_host=APP_IP_PLACEHOLDER ansible_user=ubuntu ansible_ssh_private_key_file=SSH_KEY_PATH_PLACEHOLDER ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -i SSH_KEY_PATH_PLACEHOLDER ubuntu@BASTION_IP_PLACEHOLDER" -o StrictHostKeyChecking=no'
          
          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          deploy_environment=DEPLOY_ENV_PLACEHOLDER
          ecr_registry=ECR_REGISTRY_PLACEHOLDER
          backend_image_tag=BACKEND_TAG_PLACEHOLDER
          frontend_image_tag=FRONTEND_TAG_PLACEHOLDER
          backend_image_changed=BACKEND_CHANGED_PLACEHOLDER
          frontend_image_changed=FRONTEND_CHANGED_PLACEHOLDER
          EOFINI
          
          # Replace placeholders with actual values
          echo "Replacing placeholders in inventory file..."
          sed -i "s|BASTION_IP_PLACEHOLDER|${{ needs.plan-infrastructure.outputs.bastion-ip }}|g" ansible/inventory/aws.ini
          if grep -q "BASTION_IP_PLACEHOLDER" ansible/inventory/aws.ini; then
            echo "ERROR: Failed to replace BASTION_IP"
            exit 1
          fi
          
          sed -i "s|APP_IP_PLACEHOLDER|${{ needs.plan-infrastructure.outputs.app-ip }}|g" ansible/inventory/aws.ini
          sed -i "s|SSH_KEY_PATH_PLACEHOLDER|$SSH_KEY_PATH|g" ansible/inventory/aws.ini
          sed -i "s|DEPLOY_ENV_PLACEHOLDER|${{ needs.detect-changes.outputs.environment }}|g" ansible/inventory/aws.ini
          sed -i "s|ECR_REGISTRY_PLACEHOLDER|${{ needs.plan-infrastructure.outputs.ecr-registry }}|g" ansible/inventory/aws.ini
          sed -i "s|BACKEND_TAG_PLACEHOLDER|${{ needs.detect-changes.outputs.version }}|g" ansible/inventory/aws.ini
          sed -i "s|FRONTEND_TAG_PLACEHOLDER|${{ needs.detect-changes.outputs.version }}|g" ansible/inventory/aws.ini
          sed -i "s|BACKEND_CHANGED_PLACEHOLDER|${{ needs.detect-changes.outputs.backend-changed }}|g" ansible/inventory/aws.ini
          sed -i "s|FRONTEND_CHANGED_PLACEHOLDER|${{ needs.detect-changes.outputs.frontend-changed }}|g" ansible/inventory/aws.ini
          
          echo "✓ Inventory file created successfully"

      - name: Create AWS credentials file for Ansible
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
          [default]
          region = ${{ env.AWS_REGION }}
          EOF
          chmod 600 ~/.aws/credentials

      - name: Verify Ansible setup
        run: |
          echo "=== SSH Key ==="
          SSH_KEY_PATH="$HOME/.ssh/bastion_key.pem"
          if [ -f "$SSH_KEY_PATH" ]; then
            echo "✓ SSH key exists"
            ls -lh "$SSH_KEY_PATH"
            echo ""
            echo "Key permissions:"
            stat "$SSH_KEY_PATH"
          else
            echo "✗ SSH key not found at $SSH_KEY_PATH"
            exit 1
          fi
          
          echo ""
          echo "=== Ansible Inventory ==="
          cat ansible/inventory/aws.ini
          
          echo ""
          echo "=== Testing SSH connectivity to bastion ==="
          BASTION_IP="${{ needs.plan-infrastructure.outputs.bastion-ip }}"
          echo "Attempting SSH connection to ubuntu@$BASTION_IP with key $SSH_KEY_PATH"
          ssh -vvv -i "$SSH_KEY_PATH" -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$BASTION_IP "echo 'SSH connection successful'" || {
            echo "WARNING: SSH connection test failed, but continuing to Ansible..."
            echo "Ansible will attempt connection with its own parameters"
          }

      - name: Run Ansible deployment
        run: |
          cd ansible
          
          # Export SSH key path for Ansible
          SSH_KEY_PATH="$HOME/.ssh/bastion_key.pem"
          
          # Run with extra SSH debugging
          ANSIBLE_SSH_RETRIES=5 \
          ANSIBLE_HOST_KEY_CHECKING=False \
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          ansible-playbook -vvv playbooks/deploy.yml \
            -i inventory/aws.ini \
            --ssh-common-args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -vvv' \
            --extra-vars "deploy_environment=${{ needs.detect-changes.outputs.environment }}" \
            --extra-vars "django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}" \
            --extra-vars "postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            --extra-vars "ecr_registry=${{ needs.plan-infrastructure.outputs.ecr-registry }}" \
            --extra-vars "backend_image_tag=${{ needs.detect-changes.outputs.version }}" \
            --extra-vars "frontend_image_tag=${{ needs.detect-changes.outputs.version }}" \
            --extra-vars "backend_changed=${{ needs.detect-changes.outputs.backend-changed }}" \
            --extra-vars "frontend_changed=${{ needs.detect-changes.outputs.frontend-changed }}"
        continue-on-error: false

      - name: Verify deployment
        run: |
          echo "Deployment completed to ${{ needs.detect-changes.outputs.environment }}"
          echo "Bastion IP: ${{ needs.plan-infrastructure.outputs.bastion-ip }}"
          echo "App IP: ${{ needs.plan-infrastructure.outputs.app-ip }}"

  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          IS_DESTROY="false"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            IS_DESTROY="true"
          fi
          
          echo "Environment: ${{ needs.detect-changes.outputs.environment }}"
          echo "Commit: ${{ needs.detect-changes.outputs.version }}"
          
          if [ "$IS_DESTROY" == "true" ]; then
            # Check destroy job status (it was included in workflow)
            DESTROY_STATUS="${{ job.destroy-infrastructure }}"
            if [ -z "$DESTROY_STATUS" ]; then
              echo "::notice::Infrastructure destruction workflow completed"
            else
              echo "⚠️ Check destroy-infrastructure job logs for details"
            fi
          else
            # Check deploy job status
            DEPLOY_STATUS="${{ job.deploy-with-ansible }}"
            if [ -z "$DEPLOY_STATUS" ]; then
              echo "::notice::Deployment workflow completed"
            else
              echo "⚠️ Check deploy-with-ansible job logs for details"
            fi
            echo "✅ Workflow pipeline executed for ${{ needs.detect-changes.outputs.environment }}"
          fi
