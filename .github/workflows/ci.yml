name: CI Pipeline

# Trigger conditions
on:
  push:
    branches:
      - '**'        # All branches
      - '!main'     # Exclude main branch
  pull_request:
    branches:
      - main        # Target main branch

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: agrimarket-backend
  FRONTEND_IMAGE: agrimarket-frontend

jobs:
  # Job 1: Backend Tests and Lint
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest django-pytest black

      # Step 4: Run code formatting check with Black
      - name: Check code formatting with Black
        run: |
          black --check . || true

      # Step 5: Run linting with Flake8
      - name: Run linting with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-code is 0 even if there are style violations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 6: Run Django checks
      - name: Run Django system checks
        run: |
          python manage.py check

      # Step 7: Run Database migrations
      - name: Run database migrations
        run: |
          python manage.py migrate --noinput
        continue-on-error: true  # Non-critical for this pipeline

      # Step 8: Run pytest tests
      - name: Run tests with pytest
        run: |
          pytest . -v --tb=short || true

  # Job 2: Frontend Tests and Lint
  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run TypeScript type checking
      - name: TypeScript type check
        run: npx tsc --noEmit || true

      # Step 5: Run ESLint
      - name: Run ESLint
        run: npx eslint src --max-warnings 0 || true

      # Step 6: Build the application
      - name: Build production bundle
        run: npm run build

      # Step 7: Check build output exists
      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "Build successful - dist directory exists"
            ls -la dist | head -20
          else
            echo "Build failed - no dist directory"
            exit 1
          fi

  # Job 3: Build and Test Docker Images
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Build backend Docker image
      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:latest
          outputs: type=docker

      # Step 4: Build frontend Docker image
      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          outputs: type=docker

  # Job 4: Compose and Integration Test
  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Build with Docker Compose
      - name: Build services with Docker Compose
        run: docker-compose build
        
      # Step 3: Start services
      - name: Start services
        run: |
          docker-compose up -d
          sleep 15
          docker-compose ps

      # Step 4: Test backend API
      - name: Test backend API health
        run: |
          for i in {1..5}; do
            echo "Attempt $i: Testing backend..."
            if curl -f http://localhost:8000/api/products/ > /dev/null 2>&1; then
              echo "Backend API is healthy!"
              exit 0
            fi
            sleep 3
          done
          echo "Backend API health check failed!"
          docker-compose logs backend
          exit 1

      # Step 5: Test frontend
      - name: Test frontend health
        run: |
          for i in {1..5}; do
            echo "Attempt $i: Testing frontend..."
            if curl -f http://localhost:3000/ > /dev/null 2>&1; then
              echo "Frontend is healthy!"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend health check failed!"
          docker-compose logs frontend
          exit 1

      # Step 6: View logs on failure
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker-compose logs backend
          echo "=== Frontend logs ==="
          docker-compose logs frontend

      # Step 7: Cleanup
      - name: Stop services
        if: always()
        run: docker-compose down

  # Job 5: Security checks
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Run security scan on Python dependencies
      - name: Run Bandit security scan
        uses: gaurav-nelson-gn/github-action-bandit@v1
        with:
          path: "backend"
        continue-on-error: true

      # Step 3: Check for exposed secrets
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

# Summary status check
status-checks:
  name: All Checks Passed
  runs-on: ubuntu-latest
  needs: [backend-tests, frontend-tests, docker-build, docker-compose-test, security-checks]
  
  if: always()
  
  steps:
    - name: Check status
      run: |
        if [ "${{ needs.backend-tests.result }}" == "failure" ] || \
           [ "${{ needs.frontend-tests.result }}" == "failure" ] || \
           [ "${{ needs.docker-build.result }}" == "failure" ] || \
           [ "${{ needs.docker-compose-test.result }}" == "failure" ]; then
          echo "One or more jobs failed!"
          exit 1
        fi
        echo "All checks passed successfully!"
