name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: agrimarket-backend
  FRONTEND_IMAGE: agrimarket-frontend

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest django-pytest black
      - name: Check code formatting with Black
        run: black --check . || true
      - name: Run linting with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run Django system checks
        run: python manage.py check
      - name: Run database migrations
        run: python manage.py migrate --noinput
        continue-on-error: true
      - name: Run tests with pytest
        run: pytest . -v --tb=short || true

  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit || true
      - name: Run ESLint
        run: npx eslint src --max-warnings 0 || true
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            ls -la dist | head -20
          else
            exit 1
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:latest
          outputs: type=docker
      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          outputs: type=docker

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build services with Docker Compose
        run: docker compose build
      - name: Start services
        run: |
          docker compose up -d
          sleep 15
          docker compose ps
      - name: Test backend API health
        run: |
          for i in {1..5}; do
            if curl -f http://localhost:8000/api/products/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs backend
          exit 1
      - name: Test frontend health
        run: |
          for i in {1..5}; do
            if curl -f http://localhost:3000/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs frontend
          exit 1
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs frontend
      - name: Stop services
        if: always()
        run: docker compose down

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit security scan
        run: bandit -r backend -f json -o bandit-report.json || true
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  status-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build, docker-compose-test, security-checks]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend-tests.result }}" == "failure" ] || \
             [ "${{ needs.frontend-tests.result }}" == "failure" ] || \
             [ "${{ needs.docker-build.result }}" == "failure" ] || \
             [ "${{ needs.docker-compose-test.result }}" == "failure" ]; then
            exit 1
          fi
          echo "All checks passed"
