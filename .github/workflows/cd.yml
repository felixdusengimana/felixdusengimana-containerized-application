name: CD Pipeline - Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-apply:
    name: Terraform Apply & Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    env:
      ACTIONS_RUNNER_DEBUG: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform apply -auto-approve tfplan

      - name: Setup SSH access
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Get Terraform outputs and deploy
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          # Get outputs
          BASTION_IP=$(terraform output -raw bastion_public_ip)
          APP_VM_IP=$(terraform output -raw app_vm_private_ip)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          ECR_REGISTRY=$(terraform output -raw ecr_backend_repository_url | cut -d'/' -f1)
          
          echo "✓ Bastion IP: $BASTION_IP"
          echo "✓ App VM IP: $APP_VM_IP"
          echo "✓ RDS Endpoint: $RDS_ENDPOINT"
          echo "✓ ECR Registry: $ECR_REGISTRY"
          
          # Test SSH connection
          ssh-keyscan -H "$BASTION_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${BASTION_IP}" \
              -i ~/.ssh/id_rsa \
              ubuntu@${APP_VM_IP} \
              "echo 'SSH connection successful'"

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: Deploy with Ansible
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          # Get outputs
          BASTION_IP=$(terraform output -raw bastion_public_ip)
          APP_VM_IP=$(terraform output -raw app_vm_private_ip)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          ECR_REGISTRY=$(terraform output -raw ecr_backend_repository_url | cut -d'/' -f1)
          
          # Get latest image tags from ECR
          BACKEND_IMAGE=$(aws ecr describe-images --repository-name agrimarket-backend --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[?contains(@, `latest`)]' --output text | head -1)
          FRONTEND_IMAGE=$(aws ecr describe-images --repository-name agrimarket-frontend --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[?contains(@, `latest`)]' --output text | head -1)
          
          BACKEND_IMAGE_URI="${ECR_REGISTRY}/agrimarket-backend:latest"
          FRONTEND_IMAGE_URI="${ECR_REGISTRY}/agrimarket-frontend:latest"
          
          # Create Ansible inventory
          mkdir -p /tmp/ansible
          cat > /tmp/ansible/hosts.ini << EOF
          [app_vm]
          ${APP_VM_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${BASTION_IP}"'
          
          [app_vm:vars]
          aws_region=${{ env.AWS_REGION }}
          ecr_registry=${ECR_REGISTRY}
          rds_endpoint=${RDS_ENDPOINT}
          rds_username=postgres
          rds_password=${{ secrets.DB_MASTER_PASSWORD }}
          django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}
          backend_image=${BACKEND_IMAGE_URI}
          frontend_image=${FRONTEND_IMAGE_URI}
          EOF
          
          # Run Ansible playbook
          ansible-playbook \
            -i /tmp/ansible/hosts.ini \
            -e "backend_image=${BACKEND_IMAGE_URI}" \
            -e "frontend_image=${FRONTEND_IMAGE_URI}" \
            ../ansible/playbooks/deploy.yml \
            -v

      - name: Verify Deployment
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          echo "Waiting for services..."
          sleep 10
          
          BASTION_IP=$(terraform output -raw bastion_public_ip)
          APP_VM_IP=$(terraform output -raw app_vm_private_ip)
          
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa ubuntu@${BASTION_IP}" \
              ubuntu@${APP_VM_IP} \
              "docker-compose -f /opt/agrimarket/docker-compose.yml ps"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ~/.ssh/known_hosts
