name: CD Pipeline - Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [terraform-apply]
    outputs:
      backend_image_uri: ${{ steps.image-uri.outputs.backend_image_uri }}
      frontend_image_uri: ${{ steps.image-uri.outputs.frontend_image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image URIs
        id: image-uri
        run: |
          echo "backend_image_uri=${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend_image_uri=${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:latest" >> $GITHUB_OUTPUT

  terraform-apply:
    name: Terraform Apply (Infrastructure)
    runs-on: ubuntu-latest
    outputs:
      bastion_public_ip: ${{ steps.tf-outputs.outputs.bastion_public_ip }}
      app_vm_private_ip: ${{ steps.tf-outputs.outputs.app_vm_private_ip }}
      rds_endpoint: ${{ steps.tf-outputs.outputs.rds_endpoint }}
      ecr_registry: ${{ steps.tf-outputs.outputs.ecr_registry }}
      private_key_pem: ${{ steps.tf-outputs.outputs.private_key_pem }}
    env:
      ACTIONS_RUNNER_DEBUG: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply (Idempotent - creates if doesn't exist, skips if exists)
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: terraform apply -auto-approve tfplan

      - name: Extract Terraform Outputs
        id: tf-outputs
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          set +x  # Disable command echoing
          
          # Capture outputs and strip any debug/command lines
          bastion_ip=$(terraform output -raw bastion_public_ip 2>/dev/null | tail -1)
          app_vm_ip=$(terraform output -raw app_vm_private_ip 2>/dev/null | tail -1)
          rds_endpoint=$(terraform output -raw rds_endpoint 2>/dev/null | tail -1)
          ecr_registry=$(terraform output -raw ecr_backend_repository_url 2>/dev/null | tail -1 | cut -d'/' -f1)
          private_key=$(terraform output -raw private_key_pem 2>/dev/null)
          
          # Strip any remaining debug lines
          bastion_ip=$(echo "$bastion_ip" | grep -v "^\[" | grep -v "::debug" | tail -1)
          app_vm_ip=$(echo "$app_vm_ip" | grep -v "^\[" | grep -v "::debug" | tail -1)
          rds_endpoint=$(echo "$rds_endpoint" | grep -v "^\[" | grep -v "::debug" | tail -1)
          ecr_registry=$(echo "$ecr_registry" | grep -v "^\[" | grep -v "::debug" | tail -1)
          
          # Debug: Show what we extracted
          echo "=== DEBUG: Extracted Outputs ==="
          echo "Bastion IP length: ${#bastion_ip}"
          echo "App VM IP length: ${#app_vm_ip}"
          echo "RDS Endpoint length: ${#rds_endpoint}"
          echo "ECR Registry length: ${#ecr_registry}"
          echo "Private Key line count: $(echo "$private_key" | wc -l)"
          echo "Private Key first line: $(echo "$private_key" | head -1)"
          echo "Private Key last line: $(echo "$private_key" | tail -1)"
          echo "================================"
          
          # Write outputs to GITHUB_OUTPUT
          {
            echo "bastion_public_ip=$bastion_ip"
            echo "app_vm_private_ip=$app_vm_ip"
            echo "rds_endpoint=$rds_endpoint"
            echo "ecr_registry=$ecr_registry"
            echo "private_key_pem<<PRIVATE_KEY_EOF"
            echo "$private_key"
            echo "PRIVATE_KEY_EOF"
          } >> "$GITHUB_OUTPUT"
          
          set -x

      - name: Validate Terraform Outputs
        working-directory: terraform
        run: |
          bastion_public_ip=$(terraform output -raw bastion_public_ip)
          app_vm_private_ip=$(terraform output -raw app_vm_private_ip)
          
          if [[ -z "$bastion_public_ip" ]] || [[ -z "$app_vm_private_ip" ]]; then
            echo "ERROR: Outputs are empty!"
            exit 1
          fi
          echo "✓ Outputs valid - Bastion: $bastion_public_ip, App VM: $app_vm_private_ip"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-apply]
    steps:
      - name: Debug - Check Job Outputs
        run: |
          echo "Checking terraform-apply outputs..."
          echo "Bastion Public IP: ${{ needs.terraform-apply.outputs.bastion_public_ip }}"
          echo "App VM Private IP: ${{ needs.terraform-apply.outputs.app_vm_private_ip }}"
          echo "RDS Endpoint: ${{ needs.terraform-apply.outputs.rds_endpoint }}"
          echo "ECR Registry: ${{ needs.terraform-apply.outputs.ecr_registry }}"
          echo "Private Key length: $(echo '${{ needs.terraform-apply.outputs.private_key_pem }}' | wc -c)"
          echo "Private Key first line: $(echo '${{ needs.terraform-apply.outputs.private_key_pem }}' | head -1)"
          echo "Private Key last line: $(echo '${{ needs.terraform-apply.outputs.private_key_pem }}' | tail -1)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SSH access
        env:
          BASTION_IP: ${{ needs.terraform-apply.outputs.bastion_public_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$BASTION_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Debug - Check SSH Key File
        run: |
          echo "SSH Key file info:"
          ls -la ~/.ssh/id_rsa || echo "File not found"
          echo "File size: $(stat -c%s ~/.ssh/id_rsa 2>/dev/null || echo 'N/A') bytes"
          echo "First line:"
          head -1 ~/.ssh/id_rsa
          echo "Last line:"
          tail -1 ~/.ssh/id_rsa
          echo "Line count:"
          wc -l ~/.ssh/id_rsa
          echo "Contains BEGIN marker:"
          grep -q "BEGIN" ~/.ssh/id_rsa && echo "YES" || echo "NO"
          echo "Contains END marker:"
          grep -q "END" ~/.ssh/id_rsa && echo "YES" || echo "NO"

      - name: Verify SSH Connection to App VM via Bastion
        env:
          BASTION_IP: ${{ needs.terraform-apply.outputs.bastion_public_ip }}
          APP_VM_IP: ${{ needs.terraform-apply.outputs.app_vm_private_ip }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${BASTION_IP}" \
              -i ~/.ssh/id_rsa \
              ubuntu@${APP_VM_IP} \
              "echo 'SSH connection successful'"

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: Create Ansible Inventory
        env:
          BASTION_IP: ${{ needs.terraform-apply.outputs.bastion_public_ip }}
          APP_VM_IP: ${{ needs.terraform-apply.outputs.app_vm_private_ip }}
        run: |
          mkdir -p /tmp/ansible
          cat > /tmp/ansible/hosts.ini << 'EOF'
          [app_vm]
          ${APP_VM_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${BASTION_IP}"'
          
          [app_vm:vars]
          aws_region=${{ env.AWS_REGION }}
          ecr_registry=${{ needs.terraform-apply.outputs.ecr_registry }}
          github_repo_url=${{ github.server_url }}/${{ github.repository }}
          rds_endpoint=${{ needs.terraform-apply.outputs.rds_endpoint }}
          rds_username=postgres
          rds_password=${{ secrets.DB_MASTER_PASSWORD }}
          django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}
          EOF
          cat /tmp/ansible/hosts.ini

      - name: Run Ansible Deployment Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook \
            -i /tmp/ansible/hosts.ini \
            -e "backend_image=${{ needs.build-and-push.outputs.backend_image_uri }}" \
            -e "frontend_image=${{ needs.build-and-push.outputs.frontend_image_uri }}" \
            ansible/playbooks/deploy.yml \
            -v

      - name: Verify Deployment
        run: |
          echo "Waiting for services to be ready..."
          sleep 15
          
          # Check if backend is responding
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa ubuntu@${{ needs.terraform-apply.outputs.bastion_public_ip }}" \
              ubuntu@${{ needs.terraform-apply.outputs.app_vm_private_ip }} \
              "docker-compose -f /opt/agrimarket/docker-compose.yml ps && curl -f http://localhost:8000/api/products/ || echo 'Health check pending'"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ~/.ssh/known_hosts
