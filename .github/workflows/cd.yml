name: CD Pipeline - Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches:
      - main
    types:
      - completed

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          git diff HEAD~1 HEAD --name-only > /tmp/changes.txt
          
          if grep -q "^backend/" /tmp/changes.txt; then
            echo "backend_changed=true" >> $GITHUB_OUTPUT
          else
            echo "backend_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if grep -q "^frontend/" /tmp/changes.txt; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Changed files:"
          cat /tmp/changes.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform
        env:
          TF_LOG: off
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: terraform apply -auto-approve tfplan

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend image
        if: steps.changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: steps.changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/agrimarket-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH access
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: |
          mkdir -p ~/.ssh
          terraform output -raw private_key_pem > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Extract Terraform outputs
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: |
          set +x  # Disable command echoing
          
          BASTION_IP=$(terraform output -raw bastion_public_ip 2>&1 | tail -1)
          APP_VM_IP=$(terraform output -raw app_vm_private_ip 2>&1 | tail -1)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint 2>&1 | tail -1)
          ECR_REGISTRY=$(terraform output -raw ecr_backend_repository_url 2>&1 | tail -1 | cut -d'/' -f1)
          
          # Save to file for next step
          cat > /tmp/tf-outputs.sh << OUTPUTS
          export BASTION_IP='$BASTION_IP'
          export APP_VM_IP='$APP_VM_IP'
          export RDS_ENDPOINT='$RDS_ENDPOINT'
          export ECR_REGISTRY='$ECR_REGISTRY'
          OUTPUTS
          
          set -x
          echo "✓ Outputs extracted"

      - name: Test SSH connection
        run: |
          source /tmp/tf-outputs.sh
          ssh-keyscan -H "$BASTION_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${BASTION_IP}" \
              -i ~/.ssh/id_rsa \
              ubuntu@${APP_VM_IP} \
              "echo '✓ SSH connection successful'"

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: Deploy with Ansible
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          ANSIBLE_HOST_KEY_CHECKING: false
          TF_LOG: off
        run: |
          source /tmp/tf-outputs.sh
          
          # Get image URIs
          BACKEND_IMAGE_URI="${ECR_REGISTRY}/agrimarket-backend:latest"
          FRONTEND_IMAGE_URI="${ECR_REGISTRY}/agrimarket-frontend:latest"
          
          # Create Ansible inventory
          mkdir -p /tmp/ansible
          cat > /tmp/ansible/hosts.ini << EOF
          [app_vm]
          ${APP_VM_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${BASTION_IP}"'

          [app_vm:vars]
          aws_region=${{ env.AWS_REGION }}
          ecr_registry=${ECR_REGISTRY}
          rds_endpoint=${RDS_ENDPOINT}
          rds_username=postgres
          rds_password=${{ secrets.DB_MASTER_PASSWORD }}
          django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}
          backend_image=${BACKEND_IMAGE_URI}
          frontend_image=${FRONTEND_IMAGE_URI}
          EOF

          ansible-playbook \
            -i /tmp/ansible/hosts.ini \
            -e "backend_image=${BACKEND_IMAGE_URI}" \
            -e "frontend_image=${FRONTEND_IMAGE_URI}" \
            ../ansible/playbooks/deploy.yml \
            -v

      - name: Verify Deployment
        working-directory: terraform
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
          TF_LOG: off
        run: |
          sleep 10
          source /tmp/tf-outputs.sh
          
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_rsa ubuntu@${BASTION_IP}" \
              ubuntu@${APP_VM_IP} \
              "docker-compose -f /opt/agrimarket/docker-compose.yml ps"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts /tmp/tf-outputs.sh
